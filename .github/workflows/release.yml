# Build Vespera Display and Mono from the commit a release tag points to, and
# attach the fonts to that GitHub release.
#
# Release steps: set "version" in configs/display.json and configs/mono.json
# (for example 0.0.1), commit, then publish a GitHub release tagged v0.0.1.
name: Release fonts

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild, for example v0.0.1
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  fonts:
    # macOS matches the verified toolchain and adds the CoreText checks. The build
    # needs no Xcode, so follow GitHub's current macOS image instead of pinning a
    # version that GitHub retires (macos-14 was retired on 2026-11-02).
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install FreeType, HarfBuzz and Brotli
        run: brew install freetype harfbuzz brotli

      - name: Check the tag against the configured versions
        run: python3 .github/scripts/release_version.py "$TAG"

      - name: Build and validate every font
        # Each style is checked as it is built: checksums, names and style flags,
        # outlines, shaping, combining marks, rasterization and CoreText loading.
        run: python3 build.py build

      - name: Package release assets
        run: python3 .github/scripts/package_release.py "$TAG" dist

      - name: Upload assets to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
